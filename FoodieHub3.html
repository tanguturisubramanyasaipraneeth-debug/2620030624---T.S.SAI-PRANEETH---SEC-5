<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>FoodieHub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial;
            background: #fffaf5;
        }

        header {
            background: #e85d04;
            color: white;
            padding: 20px;
            display: flex;

        }

        nav a {
            color: white;

            padding: 70px 20px;
            background: #ffe5d0;
        }

        .hero h1 {
            font-size: 40px;
            color: #9d3200;
        }

        .hero p {
            margin: 20px;
        }

        button {
            background: #e85d04;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
        }

        .menu {
            text-align: center;
            padding: 40px;
        }

        .food-card {
            display: inline-block;
            background: white;
            width: 230px;
            margin: 15px;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 3px 10px #ddd;
        }

        .food-card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 10px;
        }

        .food-card h3 {
            margin: 10px;
        }

        .food-card p {
            margin: 10px;
        }

        footer {
            background: #9d3200;
            color: white;
            padding: 20px;
            text-align: center;
        }
